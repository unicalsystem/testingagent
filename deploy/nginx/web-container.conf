# Inside the "web" container. TLS terminates at the host nginx (testingagent.unical.in.conf).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 12m;

    # Real client IP from the host nginx (the only thing that can reach this port).
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Real-IP;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://www.gstatic.com https://*.razorpay.com; style-src 'self' 'unsafe-inline'; script-src 'self' https://www.google.com https://www.gstatic.com https://checkout.razorpay.com; frame-src https://www.google.com https://recaptcha.google.com https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https://www.google.com https://api.razorpay.com https://lumberjack.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Mobile app builds (APK / IPA) up to 400 MB, on this endpoint only (release 1.8).
    location ~ ^/api/(t/[a-z0-9-]+/)?projects/[0-9]+/mobile/apps$ {
        client_max_body_size 400m;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Frame-Options DENY always;
        proxy_hide_header X-Frame-Options;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;       # Claude generation can take up to ~90 s
        proxy_send_timeout 60s;
        proxy_buffering off;           # stream large evidence downloads
        # The API sets its own security headers; declaring one here stops the server-level
        # headers (including the SPA's CSP) from being added a second time.
        add_header X-Frame-Options DENY always;
        proxy_hide_header X-Frame-Options;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://www.gstatic.com https://*.razorpay.com; style-src 'self' 'unsafe-inline'; script-src 'self' https://www.google.com https://www.gstatic.com https://checkout.razorpay.com; frame-src https://www.google.com https://recaptcha.google.com https://api.razorpay.com https://checkout.razorpay.com; connect-src 'self' https://www.google.com https://api.razorpay.com https://lumberjack.razorpay.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # Client-side routes (/projects/1, /runs/7 …) fall back to the SPA.
    location / {
        try_files $uri /index.html;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }
}
