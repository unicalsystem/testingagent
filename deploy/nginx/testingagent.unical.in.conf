# Host nginx site for https://testingagent.unical.in
# Installed by deploy/scripts/setup-nginx.sh to /etc/nginx/sites-available/ and symlinked.
# Certificates are issued by certbot (Let's Encrypt) via the webroot below.

limit_req_zone $binary_remote_addr zone=tp_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name testingagent.unical.in;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://testingagent.unical.in$request_uri; }
}

server {
    # "listen ... http2" works on nginx 1.18-1.24 (Ubuntu 22.04/24.04); newer nginx only warns.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name testingagent.unical.in;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/testingagent.unical.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testingagent.unical.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tp_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;
    access_log /var/log/nginx/testingagent.access.log;
    error_log  /var/log/nginx/testingagent.error.log warn;

    location = /api/auth/login {
        limit_req zone=tp_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/testpilot-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/testpilot-proxy.conf;
    }
}
